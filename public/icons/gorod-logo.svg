<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100">
  <!-- GOROD Oval Emblem -->
  <g transform="translate(160, 36)">
    <!-- Outer Eye / Oval Frame in Light Cyan -->
    <path
      d="M -130 0 C -90 -28 90 -28 130 0 C 90 28 -90 28 -130 0 Z"
      fill="none"
      stroke="#67abaf"
      stroke-width="5"
      stroke-linejoin="round"
    />
    <!-- GOROD Center Text in Snow White -->
    <text
      x="0"
      y="11"
      text-anchor="middle"
      font-family="'DrukWideMedium', 'HeliosExt-Bold', Arial, sans-serif"
      font-weight="900"
      font-size="34"
      letter-spacing="5"
      fill="#ffffff"
    >
      GOROD
    </text>
  </g>
  <!-- SHIPPING Subtitle in Snow White -->
  <text
    x="160"
    y="86"
    text-anchor="middle"
    font-family="'HeliosExt-Bold', 'HeliosExt', Arial, sans-serif"
    font-weight="700"
    font-size="14"
    letter-spacing="9"
    fill="#ffffff"
  >
    SHIPPING
  </text>
</svg>
